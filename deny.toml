    { crate = "toml@0.8.23", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 1.1.6+spec-1.1.0" },
    { crate = "toml_datetime@0.6.11", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 1.1.2+spec-1.1.0" },
