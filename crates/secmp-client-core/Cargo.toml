# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-client-core"
description = "Client core: contacts, sessions, invitations, constant-rate scheduler, outbox, queue pool, settings, API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `kat`: seeded timing randomness, the counting accessors (`tr_encrypt_calls`, `persist_calls`, `timing_draws`) and
# the derandomised ratchet entropy for the scheduler tests (TEST-SPEC-M6 "Conventions"); never in a shipped build.
[features]
kat = ["secmp-proto/kat", "secmp-crypto/kat", "secmp-transport/harness"]

# docs/02 §3: workspace crates plus `tokio` for `scheduler::run`, the driver of the sans-IO scheduler core (ADR-051
# Part 1.1, Part 2). The store (`secmp-store`) is M7: the scheduler sees only the `Outbox` and `Persist` traits (OB-07).
[dependencies]
secmp-crypto.workspace = true
secmp-proto.workspace = true
secmp-transport.workspace = true
tokio.workspace = true

# G7-06 (OPEN-M7-05 A): the encrypted store, outside the Kani build (`cargo kani` sets `--cfg kani`; the SQLCipher/OpenSSL
# C build has no place there). Only the store-backed `Persist`/`Outbox` use it; the scheduler sees the traits (OB-07).
[target.'cfg(not(kani))'.dependencies]
secmp-store.workspace = true

[lints]
workspace = true
