# SPDX-License-Identifier: AGPL-3.0-or-later
# On-demand runs of single SecMPro gates (`workflow_dispatch` only; M2 review C2). The job names differ from the
# required checks and the other gate jobs of `ci.yml` (`ct`, `mutants-shard`, `mutants`, `proverif-hx`), so a dispatch
# on a pull-request head never adds a check run under such a name. Each job runs the same `cargo xtask` gate lines as its `ci.yml`
# counterpart (M4 review C-4, R-14; checked by `gates::tests::dispatch_full_runs_the_linux_full_line`):
# `dispatch-fast` = `linux-fast`, `dispatch-windows` = `windows-native`, `dispatch-xwin` = `xwin-cross`,
# `dispatch-full` = `linux-full` (which delegates mutation testing, ct and the SecMP-HX models), `dispatch-ct` = `ct`,
# `dispatch-mutants-shard`/`dispatch-mutants` = `mutants-shard`/`mutants`, `dispatch-proverif-hx` = `proverif-hx`,
# `dispatch-proverif-link` = `proverif-link` (M5, the SecMP-LINK models `linux-full` delegates); the
# suites `full` and `all` run all of the delegated jobs. `cargo xtask win-test --backend github --dispatch` starts
# `suite: windows`.
# Checked by `cargo xtask policy` as every workflow (see the header of ci.yml), including the read-only token. By
# convention, not checked: checkout without persisted credentials.
name: ci-dispatch

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Jobs to run (fast = steps 1–5, 13, 14; full = ci-full, the xwin cross-build and the jobs ci-full delegates (ct, mutants, proverif-hx); windows = the Windows gate; ct = the constant-time gate alone; all = every job)"
        type: choice
        options: [all, fast, full, windows, ct]
        default: ct

permissions:
  contents: read

# A second dispatch of the same suite on the same ref cancels the running one (`cancel-in-progress`): start the next
# only after the previous run has finished.
concurrency:
  group: ci-dispatch-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # docs/06 §5 steps 1–5 (ci-fast), 13 (SBOM) and 14 (systemd exposure).
  dispatch-fast:
    if: inputs.suite == 'all' || inputs.suite == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-fast-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: Install pinned tools
        run: cargo xtask install-tools --set fast
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: ci-fast (steps 1–5)
        run: cargo xtask ci-fast --strict
      - name: SBOM (step 13) and systemd exposure (step 14)
        run: cargo xtask step --strict sbom systemd
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}-${{ github.run_attempt }}
          path: target/sbom/
          if-no-files-found: error

  # The Windows gate (Amendment A1 §2): native MSVC build, clippy, tests, KATs, hello-world binaries.
  dispatch-windows:
    if: inputs.suite == 'all' || inputs.suite == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install; rustc -vV
      - name: Tool install root
        run: |
          "SECMP_TOOLS_ROOT=$env:USERPROFILE\.secmp-tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:USERPROFILE\.secmp-tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-windows-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: Install pinned tools
        run: cargo xtask install-tools --set windows
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Windows gate
        run: cargo xtask step --strict clippy nextest doctest kat hello

  # docs/06 §5 step 11: the cargo-xwin cross-build (ADR-034).
  dispatch-xwin:
    if: inputs.suite == 'all' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: LLVM tools for clang-cl / lld-link / llvm-lib
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: NASM (aws-lc-sys assembles its x86_64 Windows objects with it; M0 spike (b))
        run: sudo apt-get install -y --no-install-recommends nasm && nasm -v
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-xwin-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: Install pinned tools
        run: cargo xtask install-tools --set xwin
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Cross-build for x86_64-pc-windows-msvc
        run: cargo xtask step --strict windows-cross

  # The constant-time gate alone (docs/06 §4, ADR-038, ADR-041): re-measurements on the GitHub-hosted runner type.
  # 330 min (M4 review C-2, R-09; delta review VD1-2), as the `ct` job of ci.yml: 40 min above the step budget
  # `expect::CT_STEP_TIMEOUT_SECONDS` (290 min, ADR-045 Amendment 1), so the build and setup fit and a run too long
  # for the budget ends with the gate's own FAIL and its progress file, not a cancellation.
  dispatch-ct:
    if: inputs.suite == 'all' || inputs.suite == 'full' || inputs.suite == 'ct'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Constant-time gate (step 5 ct)
        run: cargo xtask step --strict ct
      - name: Upload the constant-time report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ct-report-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ct-report.json
            target/ct-progress.jsonl
            target/ct-bench.log
          if-no-files-found: error

  # docs/06 §5 steps 1–14 (ci-full): the `linux-full` line; ct, mutation testing and the SecMP-HX models run in the jobs
  # below (as in ci.yml).
  dispatch-full:
    if: inputs.suite == 'all' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.secmp-tools
            ~/.kani
          key: ci-tools-full-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: Install pinned tools and nightly (Miri, fuzz)
        run: cargo xtask install-tools --set full --nightly
      - name: ProVerif 2.05 from source (sha256 as recorded by opam)
        run: |
          if [ ! -x "$HOME/.secmp-tools/bin/proverif" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib ocamlbuild
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --location -o proverif2.05.tar.gz https://proverif.inria.fr/proverif2.05.tar.gz
            echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  proverif2.05.tar.gz" | sha256sum -c -
            tar xzf proverif2.05.tar.gz
            cd proverif2.05 && ./build -nointeract
            install -m 0755 proverif "$HOME/.secmp-tools/bin/proverif"
          fi
          proverif -help | head -1
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.secmp-tools
            ~/.kani
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: ci-full (steps 1–14)
        run: cargo xtask ci-full --strict --delegated windows-native --delegated windows-cross --delegated mutants --delegated ct --delegated proverif-link --models tr

  # Step 8 as in ci.yml (ADR-047 Amendment 1): 8 shards, then the verdict over them.
  dispatch-mutants-shard:
    if: inputs.suite == 'all' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-mutants-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: Install pinned tools (cargo-mutants)
        run: cargo xtask install-tools --set mutants
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Mutation testing, one shard of 8 (step 8, `-j 3`)
        run: cargo xtask step --strict mutants --shard ${{ matrix.shard }}/8
      - name: Upload the shard's mutants evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            target/mutants.out/
            target/mutants-step.log
          if-no-files-found: error

  dispatch-mutants:
    needs: dispatch-mutants-shard
    if: always() && (inputs.suite == 'all' || inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Download the shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-*-${{ github.run_attempt }}
          path: target/mutants-shards
      - name: Mutation verdict over the 8 shards (step 8)
        run: cargo xtask step --strict mutants-merge
      - name: Upload the merged mutants evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-verdict-${{ github.sha }}-${{ github.run_attempt }}
          path: target/mutants-merged/
          if-no-files-found: error

  # Step 10 for the SecMP-HX session models as in ci.yml (`proverif-hx`).
  dispatch-proverif-hx:
    if: inputs.suite == 'all' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-proverif-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: ProVerif 2.05 from source (sha256 as recorded by opam)
        run: |
          if [ ! -x "$HOME/.secmp-tools/bin/proverif" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib ocamlbuild
            mkdir -p "$HOME/.secmp-tools/bin"
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --location -o proverif2.05.tar.gz https://proverif.inria.fr/proverif2.05.tar.gz
            echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  proverif2.05.tar.gz" | sha256sum -c -
            tar xzf proverif2.05.tar.gz
            cd proverif2.05 && ./build -nointeract
            install -m 0755 proverif "$HOME/.secmp-tools/bin/proverif"
          fi
          proverif -help | head -1
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: ProVerif, SecMP-HX session models (step 10, --models hx)
        run: cargo xtask step --strict proverif --models hx --jobs 4
      - name: Upload the ProVerif logs and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proverif-hx-${{ github.sha }}-${{ github.run_attempt }}
          path: target/proverif/
          if-no-files-found: error

  # Step 10 for the SecMP-LINK session models as in ci.yml (`proverif-link`, M5).
  dispatch-proverif-link:
    if: inputs.suite == 'all' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: Tool install root
        run: |
          echo "SECMP_TOOLS_ROOT=$HOME/.secmp-tools" >> "$GITHUB_ENV"
          echo "$HOME/.secmp-tools/bin" >> "$GITHUB_PATH"
      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ci-tools-proverif-${{ runner.os }}-${{ hashFiles('xtask/src/tools.rs', 'rust-toolchain.toml') }}
      - name: ProVerif 2.05 from source (sha256 as recorded by opam)
        run: |
          if [ ! -x "$HOME/.secmp-tools/bin/proverif" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib ocamlbuild
            mkdir -p "$HOME/.secmp-tools/bin"
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --location -o proverif2.05.tar.gz https://proverif.inria.fr/proverif2.05.tar.gz
            echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  proverif2.05.tar.gz" | sha256sum -c -
            tar xzf proverif2.05.tar.gz
            cd proverif2.05 && ./build -nointeract
            install -m 0755 proverif "$HOME/.secmp-tools/bin/proverif"
          fi
          proverif -help | head -1
      - name: Save pinned tools (right after installing, so a later failing step cannot lose the cache)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.secmp-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: ProVerif, SecMP-LINK session models (step 10, --models link)
        run: cargo xtask step --strict proverif --models link --jobs 4
      - name: Upload the ProVerif logs and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proverif-link-${{ github.sha }}-${{ github.run_attempt }}
          path: target/proverif/
          if-no-files-found: error
