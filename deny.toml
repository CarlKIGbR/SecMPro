# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny policy — docs/06 §3, ADR-015 (license decision OQ-1: AGPL-3.0-or-later for all SecMPro crates).
# Run: `cargo deny --locked check` (part of `cargo xtask ci-fast`, step 3).

[graph]
# Check the dependency graph of every shipped target, with every feature enabled.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
all-features = true

[advisories]
# RustSec: vulnerabilities always fail; unmaintained and unsound crates fail anywhere in the graph; yanked
# versions fail. An advisory may only be ignored with an ADR and a reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each entry's comment is its reason, identical to `xtask/src/expect.rs` AUDIT_IGNORES (test
# `audit_ignores_match_deny_toml`); both re-triaged at every release and at every `arti-client` bump.
ignore = [
    "RUSTSEC-2023-0071", # ADR-051 Am. 1: rsa 0.9.10 Marvin — no RSA private-key operation reachable from the selected client paths (call-site check, tor-llcrypto src/pk/rsa.rs)
    "RUSTSEC-2024-0436", # ADR-051 Am. 1: paste (unmaintained proc-macro) is compile-time only
]

[licenses]
# Allowlist for dependencies (docs/06 §3). SQLCipher is covered by BSD-3-Clause. No LGPL anywhere (ADR-024).
# Licences that are allowed but not yet present in the graph are reported as warnings, not failures.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The single copyleft exception: Slint (GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0; GPLv3 is compatible with this project's AGPL-3.0-or-later). Its `i-slint-*`
# component crates are added here, by name, when Slint enters the graph in M8 (ADR-013).
# ADR-051 Part 2 (owner, OPEN-M6-05 B): two per-crate exceptions in the Arti 0.46.0 closure. `priority-queue`
# ("LGPL-3.0-or-later OR MPL-2.0") is taken under MPL-2.0 (allowed above); its LGPL alternative is not used.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "slint" },
    { allow = ["Unlicense"], crate = "async_executors" },
    { allow = ["CC0-1.0"], crate = "notify" },
]

[licenses.private]
# Our own crates are unpublished (`publish = false`) and AGPL-3.0-or-later; the allowlist governs dependencies.
ignore = true

[bans]
multiple-versions = "deny"
# Path dependencies between workspace crates carry no version; everything else must be a concrete version.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Exceptions to `multiple-versions`, one entry per duplicated version with the direct dependency that pulls it
# (ADR-051 Part 2, OPEN-M6-04 A, TEST-SPEC-M6 X-02); no `skip-tree`. Arti 0.46.0 brings older majors of the RustCrypto,
# dalek and rand crates beside the workspace pins; they are never used for SecMP constructions (CLAUDE.md §1.6).
skip = [
    { crate = "block-buffer@0.10.4", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.12.1" },
    { crate = "cipher@0.4.4", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.5.2" },
    { crate = "const-oid@0.9.6", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.10.2" },
    { crate = "cpufeatures@0.2.17", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.3.1" },
    { crate = "crypto-common@0.1.7", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.2.2" },
    { crate = "curve25519-dalek@4.1.3", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 5.0.0" },
    { crate = "darling@0.14.4", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "darling@0.21.3", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "darling_core@0.14.4", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "darling_core@0.21.3", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "darling_macro@0.14.4", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "darling_macro@0.21.3", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.24.1" },
    { crate = "digest@0.10.7", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.11.3" },
    { crate = "ed25519@2.2.3", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 3.0.0" },
    { crate = "ed25519-dalek@2.2.0", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 3.0.0" },
    { crate = "foldhash@0.1.5", reason = "pulled by arti-client (ADR-051 Part 2); the Arti closure also has 0.2.0" },
