    { crate = "sha2@0.10.9", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.11.0" },
    { crate = "sha3@0.10.9", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.11.0" },
