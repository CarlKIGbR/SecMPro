# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny policy — docs/06 §3, ADR-015 (license decision OQ-1: AGPL-3.0-or-later for all SecMPro crates).
# Run: `cargo deny --locked check` (part of `cargo xtask ci-fast`, step 3).

[graph]
# Check the dependency graph of every shipped target, with every feature enabled.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
all-features = true

[advisories]
# RustSec: vulnerabilities always fail; unmaintained and unsound crates fail anywhere in the graph; yanked
# versions fail. An advisory may only be ignored with an ADR and a reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each entry's comment is its reason, identical to `xtask/src/expect.rs` AUDIT_IGNORES (test
# `audit_ignores_match_deny_toml`); both re-triaged at every release and at every `arti-client` bump.
ignore = [
    "RUSTSEC-2023-0071", # ADR-051 Am. 1: rsa 0.9.10 Marvin — no RSA private-key operation reachable from the selected client paths (call-site check, tor-llcrypto src/pk/rsa.rs)
    "RUSTSEC-2024-0436", # ADR-051 Am. 1: paste (unmaintained proc-macro) is compile-time only
    "RUSTSEC-2026-0459", # ADR-051 Am. 8: libsqlite3-sys 0.37.0 (CVE-2026-119375, WAL short read) — bundled-sqlcipher builds are not reached by the patched range (sqlcipher-src 419.0.6 = SQLite 3.53.4); SQLCipher page HMAC rejects a planted frame; removed in the first milestone after Arti's rusqlite pulls a SQLCipher on SQLite >= 3.54.0
    "RUSTSEC-2026-0542", # ADR-051 Am. 10: humantime 2.4.0 — unmaintained (chronotope/chrono#1768), no patched version; pulled only via arti-client 0.46.0 (directly and through humantime-serde 1.1.1 from tor-config, tor-circmgr and other tor-* 0.46.0) ← secmp-transport ← secmp-client-core ← secmp-cli (since M7-C1, ADR-051 Am. 10 correction); not secmp-relay, secmp-ui, secmp-crypto, secmp-proto; no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Arti drops humantime, whichever is first
    "RUSTSEC-2026-0543", # ADR-051 Am. 10: chrono 0.4.45 — unmaintained (chronotope/chrono#1768), no patched version; as an optional dependency of serde_with 3.24.0 (via Arti) not compiled (cargo tree -i prints nothing for that path), and since M8 compiled via i-slint-core 1.18.1 and reported by cargo deny (ADR-063, HB-66); no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Arti's serde_with drops chrono from the lock, whichever is first
    "RUSTSEC-2026-0441", # ADR-063: pin-utils 0.1.1 — unmaintained, no patched version; pulled only via spin_on 0.1.1 ← i-slint-renderer-skia 1.18.1, an iOS-only dependency of i-slint-backend-winit (no shipped target builds it; the lock holds it); no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Slint drops it, whichever is first
    "RUSTSEC-2026-0192", # ADR-063: ttf-parser 0.25.1 — unmaintained, no patched version; pulled via owned_ttf_parser ← ab_glyph ← sctk-adwaita ← winit 0.30.13 (window decorations of Slint's winit backend on Wayland) ← secmp-ui; no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Slint drops it, whichever is first
    "RUSTSEC-2026-0371", # ADR-063: zbus_names 4.3.5 — unmaintained, no patched version; pulled via zbus ← accesskit_atspi_common ← accesskit_unix ← accesskit_winit (AT-SPI accessibility of Slint on Linux) ← secmp-ui; no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Slint drops it, whichever is first
    "RUSTSEC-2026-0370", # ADR-063: zvariant 5.15.1 — unmaintained, no patched version; pulled via accesskit_atspi_common ← accesskit_unix ← accesskit_winit (AT-SPI accessibility of Slint on Linux) ← secmp-ui; no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Slint drops it, whichever is first
    "RUSTSEC-2026-0372", # ADR-063: zvariant_derive 5.15.1 — unmaintained, no patched version; pulled via zvariant (see RUSTSEC-2026-0370) ← secmp-ui; no known vulnerability; re-evaluate at the pre-release hardening phase (ADR-062) or when Slint drops it, whichever is first
]

[licenses]
# Allowlist for dependencies (docs/06 §3). SQLCipher is covered by BSD-3-Clause. No LGPL anywhere (ADR-024).
# Licences that are allowed but not yet present in the graph are reported as warnings, not failures.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0", # ADR-063 (pre-approved for M8)
]
confidence-threshold = 0.93
# The single copyleft exception: Slint (GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0; GPLv3 is compatible with this project's AGPL-3.0-or-later). Its `i-slint-*`
# component crates and `slint-macros` are listed here by name (M8, ADR-063; each takes the GPL-3.0-only alternative).
# ADR-051 Part 2 (owner, OPEN-M6-05 B): two per-crate exceptions in the Arti 0.46.0 closure. `priority-queue`
# ("LGPL-3.0-or-later OR MPL-2.0") is taken under MPL-2.0 (allowed above); its LGPL alternative is not used.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "slint" },
    { allow = ["GPL-3.0-only"], crate = "slint-macros" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-selector" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-winit" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-common" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-compiler" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-core" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-core-macros" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-femtovg" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-software" },
    { allow = ["Unlicense"], crate = "async_executors" },
    { allow = ["CC0-1.0"], crate = "notify" },
]

[licenses.private]
# Our own crates are unpublished (`publish = false`) and AGPL-3.0-or-later; the allowlist governs dependencies.
ignore = true

[bans]
multiple-versions = "deny"
# Path dependencies between workspace crates carry no version; everything else must be a concrete version.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Exceptions to `multiple-versions`, one entry per duplicated version with the direct dependency that pulls it
# (ADR-051 Part 2, OPEN-M6-04 A, TEST-SPEC-M6 X-02); no `skip-tree`. Arti 0.46.0 brings older majors of the RustCrypto,
