# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-testkit"
description = "Test harness: in-process relay + N clients, virtual clock, KAT loaders, simulations, fault injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The differential tests (tests/differential.rs): secmp-crypto against ml-kem and aws-lc-rs (docs/06 §4); the
# constant-time bench (benches/ct.rs).
# `harness`: the in-process relay + clients (src/harness, tests/harness) and the relay's direct TLS listener on
# loopback (`DirectRelay`, TLS-13/TLS-14; the relay's own `direct-tls` feature, so no TLS crate is a dependency of this
# crate); `kat` adds the differential suites and the constant-time bench. The coverage gate turns on `harness` only (the differential suites take minutes under
# instrumentation and cover no workspace line).
harness = [
    "secmp-crypto/kat",
    "secmp-proto/kat",
    "secmp-relay/kat",
    "secmp-relay/direct-tls",
    "secmp-transport/harness",
    "secmp-client-core/kat",
]
kat = ["harness"]

# The harness (feature `harness`, which `kat` includes): the relay in process, the SecMP-LINK client, derandomised
# entropy. Workspace crates (docs/02 §3: testkit may use any workspace crate except secmp-ui) plus the normal
# dependencies `serde_json` (the KAT loaders, ADR-037) and `tokio` (`MemProvider`, ADR-051 Part 1.1); no other
# third-party runtime crate (pinned by `expect::NORMAL_DEPENDENCY_ALLOW`).
[dependencies]
secmp-crypto.workspace = true
secmp-proto.workspace = true
secmp-relay.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Not under Miri (`cargo miri` sets `--cfg=miri`, which Cargo's target cfg sees): `secmp-crypto` and `secmp-proto` reach
# this crate as a dev-dependency for the KAT loaders only, and the transport closure (rustls → aws-lc-sys, Arti's
# bundled SQLite) is C code that the portable Miri step cannot cross-build for aarch64 (linux-full of PR run
# 38724110285). The harness, the only user of these two crates, is compiled out under Miri (`src/lib.rs`).
[target.'cfg(not(miri))'.dependencies]
secmp-client-core.workspace = true
secmp-transport.workspace = true

# Test-only. `chacha20poly1305`, `subtle` and `sha3` serve the constant-time bench (its isolating CAEAD targets and
# its input stream), `secmp-proto` its TR targets (ADR-042); all are workspace crates of the vetted closure.
[dev-dependencies]
secmp-crypto = { workspace = true, features = ["kat"] }
secmp-proto = { workspace = true, features = ["kat"] }
ml-kem.workspace = true
aws-lc-rs.workspace = true
sha3.workspace = true
chacha20poly1305.workspace = true
subtle.workspace = true
# ADR-051 Part 2: network simulations (docs/06 §4), dev only.
turmoil.workspace = true
# `tokio::time::pause` for the virtual-time tests of the tokio driver (BRIEF M6-B §2.2): feature `test-util`, test
# builds only — never in a shipped build (ADR-051 Am. 3; policy test `tokio_test_util_is_dev_only`).
tokio = { workspace = true, features = ["test-util"] }

# The M5 harness tests (T-01…T-09, T-11, H-01…H-13, G-06): they need feature `kat` (the in-process relay, derandomised
# entropy).
[[test]]
name = "harness"
path = "tests/harness/main.rs"
required-features = ["harness"]

# The owner-operated Tor smoke check (TEST-SPEC-M6 TOR-10, X-10): needs the Tor network, run by hand.
[[example]]
name = "tor_smoke"
required-features = ["harness"]

# dudect-style constant-time tests (release profile), run by `cargo xtask step ct` (ADR-038, ADR-041); moved here from
# secmp-crypto by ADR-042.
[[bench]]
name = "ct"
harness = false
required-features = ["kat"]

[lints]
workspace = true
