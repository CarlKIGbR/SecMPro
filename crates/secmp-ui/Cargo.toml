[package]
name = "secmp-ui"
description = "SecMPro desktop UI (Slint) for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# docs/02 §3, ADR-063: the client core, the desktop system layer and the toolkit; nothing else (`cargo xtask policy`).
[dependencies]
secmp-client-core.workspace = true
secmp-sys-desktop.workspace = true
slint.workspace = true
# ADR-063: only to switch on its feature `fontconfig-dlopen` (fontconfig is loaded at run time); no code uses the crate.
i-slint-common.workspace = true
# ADR-064: the module matrix of the invitation's and the safety number's QR code.
qrcode.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true

[lints]
workspace = true
