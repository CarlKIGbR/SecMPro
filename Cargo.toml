# SPDX-License-Identifier: AGPL-3.0-or-later
# SecMPro workspace (docs/02 §3, docs/06 §1–2, §6).

[workspace]
resolver = "3"
members = [
    "crates/secmp-crypto",
    "crates/secmp-proto",
    "crates/secmp-transport",
    "crates/secmp-store",
    "crates/secmp-client-core",
    "crates/secmp-relay",
    "crates/secmp-cli",
    "crates/secmp-ui",
    "crates/secmp-sys-mem",
    "crates/secmp-sys-desktop",
    "crates/secmp-testkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CarlKIGbR/SecMPro"
publish = false

# All versions live here; crates use `workspace = true` (docs/06 §1). Every direct dependency has an ADR line
# (docs/08) and a cargo-vet record (docs/06 §3).
[workspace.dependencies]
# ADR-031: JSON for `cargo metadata`, cargo-llvm-cov and crates.io index lines — used by xtask; ADR-037: also
# by secmp-testkit (KAT loaders, test-only).
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

# ADR-023, ADR-037: the primitive crates of secmp-crypto (docs/06 §3). Exact pins; a bump requires the KATs,
# the differential tests and the frozen vectors to pass again. Vetting: ADR-036 (supply-chain/audits.toml).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768", "mlkem1024"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha3 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }

# ADR-037: operating-system bindings of secmp-sys-mem (SecretPage).
libc = { version = "=0.2.189", default-features = false }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# ADR-023, ADR-036, ADR-037: test-only differential partners (dev-dependencies of secmp-testkit); never in the
# shipped closure.
ml-kem = { version = "=0.3.2", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }

# ADR-040: seeded generators for the property tests of secmp-proto (dev-dependency only; never key material).
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }

# Workspace crates (path dependencies; docs/02 §3 fixes who may depend on whom).
secmp-crypto = { path = "crates/secmp-crypto" }
secmp-proto = { path = "crates/secmp-proto" }
secmp-sys-mem = { path = "crates/secmp-sys-mem" }
secmp-testkit = { path = "crates/secmp-testkit" }

[workspace.lints.rust]
unsafe_code = "deny"              # every crate except secmp-sys-* additionally declares #![forbid(unsafe_code)] (checked by `xtask ci` with a grep);
                                  # a workspace-level "forbid" cannot be relaxed per crate (E0453), hence deny + per-crate forbid
missing_docs = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }  # declares `cfg(kani)`: the Kani harnesses (docs/06 §4) compile only under `cargo kani`

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
large_stack_arrays = "warn"
undocumented_unsafe_blocks = "deny"      # every unsafe block needs a `// SAFETY:` comment (fires only where unsafe exists)
multiple_unsafe_ops_per_block = "deny"   # one unsafe operation per block

# docs/06 §6 — release profile for reproducible builds.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
