# docs/06 §2. Sanctioned exceptions for SystemTime::now (each with #[allow(clippy::disallowed_methods)] and a comment):
# secmp-client-core::clock, the relay's hour-bucket function, secmp-cli output timestamps. No other site.
# `rand` is in the graph since M1 (via libcrux-traits) without its thread-local RNG: `rand::thread_rng` (≤ 0.8) and
# `rand::rng` (≥ 0.9) may not resolve, hence `allow-invalid` (it only silences "path not found"; any call that does
# resolve is still denied).
disallowed-methods = [
    { path = "rand::thread_rng", reason = "use getrandom (docs/06 §2, CLAUDE.md §4)", allow-invalid = true },
    { path = "rand::rng", reason = "use getrandom (docs/06 §2, CLAUDE.md §4)", allow-invalid = true },
    { path = "std::time::SystemTime::now", reason = "wall clock only at the sanctioned sites of docs/06 §2; use secmp-client-core::clock" },
]

# Project and tool names that are not code identifiers (`clippy::doc_markdown`); ".." keeps clippy's defaults.
doc-valid-idents = [
    "SecMP", "SecMPro", "ProVerif", "SQLCipher", "CycloneDX",
    "ChaCha20", "XChaCha20", "HybridKEM", "HybridSign", "RustCrypto", "HashML", "UtC",
    "..",
]
