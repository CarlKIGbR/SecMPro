# SPDX-License-Identifier: AGPL-3.0-or-later
# Dependabot version updates (M0 review, Q8). A convenience, not a control: the 7-day cooldown gate is
# `cargo xtask step cooldown` (docs/06 §3), and every update still passes deny/vet/audit and the ADR rule for
# direct dependencies.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
