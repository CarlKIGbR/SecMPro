[package]
name = "secmp-store"
description = "Encrypted profile store: SQLCipher via rusqlite, key wrapping, migrations, incremental ratchet persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `kat`: the fixed test key, temporary profiles, failure and crash injection and the counting accessors (TEST-SPEC-M7
# "Conventions"); never in a shipped build (ST-09).
[features]
kat = ["secmp-crypto/kat", "secmp-proto/kat"]

[dependencies]
rusqlite.workspace = true
secmp-crypto.workspace = true
secmp-proto.workspace = true

[lints]
workspace = true
