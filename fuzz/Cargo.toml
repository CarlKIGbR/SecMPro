# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-fuzz package (docs/06 §4–5 step 6). Outside the main workspace (its own `[workspace]` and Cargo.lock):
# built only with the pinned nightly by `cargo xtask step fuzz`; `libfuzzer-sys` is a fuzzing-only dependency
# (ADR-037) and never part of a shipped build.
[package]
name = "secmp-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "=0.4.13" }
secmp-crypto = { path = "../crates/secmp-crypto" }
# `kat` (M3): the `tr_decrypt` target builds its fixed session with `FixedEntropy` and seals headers under the
# receiver's keys (`RatchetState::hk_s_kat`, `receiving_header_keys_kat`, `Nonce24::from_bytes_kat`).
secmp-proto = { path = "../crates/secmp-proto", features = ["kat"] }
# `kat` (M5 Phase B): the `relay_*` targets check the relay's stores through `snapshot_kat`, `store_digest_kat` and
# `budget_used_kat`.
secmp-relay = { path = "../crates/secmp-relay", features = ["kat"] }
# `kat` / `harness` (M6 Phase A): the `client_pipeline_responses` and `scheduler_event_sequence` targets build a client
# `Channel` over the fixed honest link (`Channel::from_link_kat`) and a seeded `TimingRng`.
secmp-transport = { path = "../crates/secmp-transport", features = ["harness"] }
secmp-client-core = { path = "../crates/secmp-client-core", features = ["kat"] }

[workspace]
members = ["."]

[[bin]]
name = "x25519_dh"
path = "fuzz_targets/x25519_dh.rs"
test = false
doc = false
bench = false

