# docs/06 §2. Sanctioned exceptions for SystemTime::now (each with #[allow(clippy::disallowed_methods)] and a comment):
# secmp-client-core::clock, the relay's hour-bucket function, secmp-cli output timestamps. No other site.
disallowed-methods = [
    { path = "rand::thread_rng", reason = "use OsRng / getrandom (docs/06 §2, CLAUDE.md §4)" },
    { path = "std::time::SystemTime::now", reason = "wall clock only at the sanctioned sites of docs/06 §2; use secmp-client-core::clock" },
]

# Project and tool names that are not code identifiers (`clippy::doc_markdown`); ".." keeps clippy's defaults.
doc-valid-idents = ["SecMP", "SecMPro", "ProVerif", "SQLCipher", "CycloneDX", ".."]
