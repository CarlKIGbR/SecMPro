# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-proto"
description = "Sans-IO SecMP/1 protocol core: encodings, cells, frames, INV/HX/TR/LINK state machines, Q commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Derandomised entry points for the vectors and the constant-time bench (docs/06 §5 step 5; plan M3 D12, ADR-042);
# never enabled in a shipped build. It enables `secmp-crypto`'s `kat`.
[features]
kat = ["secmp-crypto/kat"]

[dependencies]
secmp-crypto.workspace = true

# ADR-040: test-only (the vector files). `secmp-crypto`'s `kat` feature (the SCHEMA §2 streams and the
# derandomised signers) is enabled for the tests and the `gen-encodings` example only.
[dev-dependencies]
secmp-crypto = { workspace = true, features = ["kat"] }
serde_json.workspace = true
rand.workspace = true

# The `tr` vectors need the derandomised entry points (feature `kat`); run by the `kat` step.
[[test]]
name = "tr_vectors"
required-features = ["kat"]

[lints]
workspace = true

# Kani (docs/06 §4; `src/kani_proofs.rs`): the harnesses replace the `secmp-crypto` key checks with
# nondeterministic outcomes (`keys::kani_stubs`), which needs Kani's function stubbing (RFC 0002).
[package.metadata.kani.unstable]
stubbing = true
