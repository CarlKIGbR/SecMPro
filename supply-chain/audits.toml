[[audits.rand]]
who = "Claude Code (Opus 5.5), SecMPro implementer"
criteria = "safe-to-deploy"
delta = "0.10.1 -> 0.10.3"
notes = "delta audit by implementer; reviewer read; owner approved. ADR-036 (3). Diff: docs/reviews/M01-evidence/vet-deltas/rand-0.10.1-0.10.3.diff. Two unsafe blocks removed (slice get_unchecked, char::from_u32_unchecked, replaced by checked calls); serde deserialization of UniformChar validated; float Uniform/WeightedIndex overflow fixes returning errors instead of panicking; docs and tests. No new unsafe, no I/O, no build script, no new dependencies. Owner approval: Christopher Carl, 2026-09-29 (M1 review §D)."

[[audits.rand_core]]
who = "Claude Code (Opus 5.5), SecMPro implementer"
criteria = "safe-to-deploy"
