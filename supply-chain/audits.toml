[[audits.rustls-webpki]]
who = "Claude Code <noreply@anthropic.com>"
criteria = "safe-to-deploy"
delta = "0.103.15 -> 0.103.16"
notes = "Delta read in full. Security patch for RUSTSEC-2026-0382: adds a DISTRUSTED_SPKIS list (8 emSign intermediate SPKIs, src/data/distrusted/*.spki.der) checked in verify_cert build_chain on every path node and on the trust anchor; new Error::CertDistrusted; ChainOptions gains distrusted_spkis; new unit test. Files: Cargo.toml(.orig) version, end_entity.rs, error.rs, verify_cert.rs, 8 data files. No build script, no new dependencies, no unsafe, no feature changes."

