# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-proto"
description = "Sans-IO SecMP/1 protocol core: encodings, cells, frames, INV/HX/TR/LINK state machines, Q commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
secmp-crypto.workspace = true

# ADR-040: test-only (the vector files). `secmp-crypto`'s `kat` feature (the SCHEMA §2 streams and the
# derandomised signers) is enabled for the tests and the `gen-encodings` example only.
[dev-dependencies]
secmp-crypto = { workspace = true, features = ["kat"] }
serde_json.workspace = true
rand.workspace = true

[lints]
workspace = true
