notes = "delta audit by implementer; reviewer read; owner approved. ADR-036 (3). Diff: docs/reviews/M01-evidence/vet-deltas/rand_core-0.10.0-0.10.1.diff (CHANGELOG, version bump, two doc-comment links; no code change). Owner approval: Christopher Carl, 2026-09-29 (M1 review §D)."

