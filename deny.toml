    { crate = "hkdf@0.12.4", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.13.0" },
    { crate = "hmac@0.12.1", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.13.0" },
    { crate = "inout@0.1.4", reason = "pulled by arti-client (ADR-051 Part 2); the pre-M6 graph uses 0.2.2" },
