# MR-05 (M6 C2-4): the wall time of one cell preparation is only meaningful on a machine that is not running other tests, so
# `cpu_per_slot_measured` runs alone (nextest waits for the running tests and starts no other while it runs).
[[profile.default.overrides]]
filter = 'test(cpu_per_slot_measured)'
threads-required = "num-test-threads"

# TEST-SPEC-M7 G7-10 (OPEN-M7-20 A, ADR-047 Amendment 9): the profile of the second mutants run (`--profile mutants-harness`,
# `gates::mutants_harness_args`). Its one override starts the killers of clock and period mutants before every other test by
# priority, whatever their module is called (`gates::mutants_killer_profile`, test `mutant_killers_run_first_by_filter`).
[profile.mutants-harness]

[[profile.mutants-harness.overrides]]
filter = 'test(/^m0_early::/)'
priority = 100
