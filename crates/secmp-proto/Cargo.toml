# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-proto"
description = "Sans-IO SecMP/1 protocol core: encodings, cells, frames, INV/HX/TR/LINK state machines, Q commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Derandomised entry points for the vectors and the constant-time bench (docs/06 §5 step 5; plan M3 D12, ADR-042);
# never enabled in a shipped build. It enables `secmp-crypto`'s `kat`.
[features]
kat = ["secmp-crypto/kat"]

[dependencies]
secmp-crypto.workspace = true

# ADR-040: test-only (the vector files). `secmp-crypto`'s `kat` feature (the SCHEMA §2 streams and the
# derandomised signers) is enabled for the tests and the `gen-encodings` example only.
[dev-dependencies]
secmp-crypto = { workspace = true, features = ["kat"] }
serde_json.workspace = true
rand.workspace = true

# The `tr` vectors need the derandomised entry points (feature `kat`); run by the `kat` step.
[[test]]
name = "tr_vectors"
required-features = ["kat"]

# The `tr` property tests track every message key (`message_key_digest_kat`) and derandomise the ratchet
# (`FixedEntropy`): feature `kat`.
[[test]]
name = "tr_properties"
required-features = ["kat"]

# The Rust generator of the `tr` vectors (`tests/common/tr.rs`) against the vector file, and the example that writes
# `vectors/rust/tr.json` for `cargo xtask vectors`; both need feature `kat`.
[[test]]
name = "tr_generator"
required-features = ["kat"]

[[example]]
name = "gen-tr"
required-features = ["kat"]

# The `hx` suite: the Rust generator (`tests/common/hx_gen.rs`, an independent construction of SecMP-INV/HX) against
# the vector file, the replay of the file through the library, and the example that writes `vectors/rust/hx.json`
# for `cargo xtask vectors`; all need feature `kat`.
[[test]]
name = "hx"
path = "tests/hx/main.rs"
required-features = ["kat"]

[[example]]
name = "gen-hx"
required-features = ["kat"]

# The SecMP-LINK tests (milestone M5): the replay of the `link` suite's handshake groups, the client and relay
# handshake, the frames and the properties; they need feature `kat` (`FixedEntropy`, the handshake trace).
[[test]]
name = "link"
path = "tests/link/main.rs"
required-features = ["kat"]

[[test]]
name = "link_client"
required-features = ["kat"]

[[test]]
name = "link_relay"
required-features = ["kat"]

[[test]]
name = "link_frames"
required-features = ["kat"]

# The performance measurement of M3 (plan D11: encrypt + decrypt < 3 ms), OS randomness, feature `kat` off; run in
# the release profile by `cargo xtask step perf`.
[[example]]
name = "tr-perf"

[lints]
workspace = true

# Kani (docs/06 §4; `src/kani_proofs.rs`): the harnesses replace the `secmp-crypto` key checks with
# nondeterministic outcomes (`keys::kani_stubs`), which needs Kani's function stubbing (RFC 0002).
[package.metadata.kani.unstable]
stubbing = true
