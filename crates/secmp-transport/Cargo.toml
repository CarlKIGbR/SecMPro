# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-transport"
description = "QueueTransport trait, SecMP-LINK client, relay-queue transport, Tor and TLS stream providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The link's keys for the byte-level tests of the harness (`Session::link_kat`); never enabled in a shipped build.
[features]
kat = ["secmp-proto/kat", "secmp-crypto/kat"]

# docs/02 §3: `secmp-proto`, `secmp-crypto` only among workspace crates; no third-party runtime crate in M5 (the
# stream is `std::io`, ADR-049).
[dependencies]
secmp-crypto.workspace = true
secmp-proto.workspace = true

[lints]
workspace = true
