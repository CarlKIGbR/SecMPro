# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-crypto"
description = "Typed cryptographic primitives and SecMP constructions (the only crate using crypto crates for SecMP constructions)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Derandomised entry points (fixed randomness), the external KATs, the differential tests and the SecMP vector
# generator (docs/06 §5 step 5, vectors/SCHEMA.md). Never enabled in a shipped build.
kat = []

[dependencies]
secmp-sys-mem.workspace = true
libcrux-ml-kem.workspace = true
ml-dsa.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
hmac.workspace = true
hkdf.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
secmp-testkit.workspace = true
ml-kem.workspace = true
aws-lc-rs.workspace = true
shake.workspace = true
serde_json.workspace = true

[[example]]
name = "gen-vectors"
required-features = ["kat"]

# dudect-style constant-time tests (release profile), run by `cargo xtask step ct`.
[[bench]]
name = "ct"
harness = false
required-features = ["kat"]

[lints]
workspace = true
