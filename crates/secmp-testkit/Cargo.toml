# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "secmp-testkit"
description = "Test harness: in-process relay + N clients, virtual clock, KAT loaders, simulations, fault injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The differential tests (tests/differential.rs): secmp-crypto against ml-kem and aws-lc-rs (docs/06 §4); the
# constant-time bench (benches/ct.rs).
# `harness`: the in-process relay + clients (src/harness, tests/harness); `kat` adds the differential suites and the
# constant-time bench. The coverage gate turns on `harness` only (the differential suites take minutes under
# instrumentation and cover no workspace line).
harness = ["secmp-crypto/kat", "secmp-proto/kat", "secmp-relay/kat", "secmp-transport/harness"]
kat = ["harness"]

# The harness (feature `kat`): the relay in process, the SecMP-LINK client, derandomised entropy. Workspace crates
# only (docs/02 §3: testkit may use any workspace crate except secmp-ui); no third-party runtime crate (ADR-049).
[dependencies]
secmp-crypto.workspace = true
secmp-proto.workspace = true
secmp-relay = { path = "../secmp-relay" }
secmp-transport = { path = "../secmp-transport" }
serde_json.workspace = true

# Test-only. `chacha20poly1305`, `subtle` and `sha3` serve the constant-time bench (its isolating CAEAD targets and
# its input stream), `secmp-proto` its TR targets (ADR-042); all are workspace crates of the vetted closure.
[dev-dependencies]
secmp-crypto = { workspace = true, features = ["kat"] }
secmp-proto = { workspace = true, features = ["kat"] }
ml-kem.workspace = true
aws-lc-rs.workspace = true
sha3.workspace = true
chacha20poly1305.workspace = true
subtle.workspace = true

# The M5 harness tests (T-01…T-09, T-11, H-01…H-13, G-06): they need feature `kat` (the in-process relay, derandomised
# entropy).
[[test]]
name = "harness"
path = "tests/harness/main.rs"
required-features = ["harness"]

# dudect-style constant-time tests (release profile), run by `cargo xtask step ct` (ADR-038, ADR-041); moved here from
# secmp-crypto by ADR-042.
[[bench]]
name = "ct"
harness = false
required-features = ["kat"]

[lints]
workspace = true
